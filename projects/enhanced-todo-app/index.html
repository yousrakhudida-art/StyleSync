<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📝 TaskHub</h1>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                    🌙
                </button>
            </div>

            <div class="sidebar-section">
                <h3>Filters</h3>
                <button class="filter-btn active" data-filter="all">📋 All Tasks</button>
                <button class="filter-btn" data-filter="active">⏳ Active</button>
                <button class="filter-btn" data-filter="completed">✅ Completed</button>
                <button class="filter-btn" data-filter="overdue">⚠️ Overdue</button>
            </div>

            <div class="sidebar-section">
                <h3>Priority</h3>
                <button class="priority-filter" data-priority="high">🔴 High</button>
                <button class="priority-filter" data-priority="medium">🟡 Medium</button>
                <button class="priority-filter" data-priority="low">🟢 Low</button>
            </div>

            <div class="sidebar-section">
                <h3>Categories</h3>
                <div class="category-list" id="categoryList">
                    <!-- Categories dynamically added -->
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Actions</h3>
                <button class="action-btn export" id="exportBtn">📥 Export</button>
                <button class="action-btn import" id="importBtn">📤 Import</button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h2 id="pageTitle">All Tasks</h2>
                    <p class="header-subtitle" id="taskCount">0 tasks</p>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="🔍 Search tasks..."
                        >
                    </div>
                </div>
            </header>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="statTotal">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <span class="stat-label">Completed</span>
                        <span class="stat-value" id="statCompleted">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏳</div>
                    <div class="stat-info">
                        <span class="stat-label">Remaining</span>
                        <span class="stat-value" id="statRemaining">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-info">
                        <span class="stat-label">Progress</span>
                        <span class="stat-value" id="statProgress">0%</span>
                    </div>
                </div>
            </div>

            <!-- Add Task Form -->
            <div class="add-task-section">
                <h3>Add New Task</h3>
                <form id="addTaskForm" class="add-task-form">
                    <div class="form-row">
                        <input 
                            type="text" 
                            id="taskTitle" 
                            class="form-input" 
                            placeholder="Task title..."
                            required
                        >
                    </div>
                    <div class="form-row">
                        <textarea 
                            id="taskDescription" 
                            class="form-textarea" 
                            placeholder="Description (optional)..."
                            rows="2"
                        ></textarea>
                    </div>
                    <div class="form-row">
                        <select id="taskCategory" class="form-select">
                            <option value="personal">👥 Personal</option>
                            <option value="work">💼 Work</option>
                            <option value="shopping">🛒 Shopping</option>
                            <option value="health">💪 Health</option>
                            <option value="finance">💰 Finance</option>
                            <option value="education">🎓 Education</option>
                            <option value="events">🎉 Events</option>
                            <option value="home">🏠 Home</option>
                        </select>
                        <select id="taskPriority" class="form-select">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                        <input 
                            type="date" 
                            id="taskDueDate" 
                            class="form-input"
                        >
                    </div>
                    <button type="submit" class="add-task-btn">+ Add Task</button>
                </form>
            </div>

            <!-- Tasks List -->
            <div class="tasks-section">
                <div class="tasks-header">
                    <h3>Tasks</h3>
                    <div class="sort-options">
                        <label>Sort by:</label>
                        <select id="sortSelect" class="sort-select">
                            <option value="created">Created Date</option>
                            <option value="duedate">Due Date</option>
                            <option value="priority">Priority</option>
                            <option value="title">Title A-Z</option>
                        </select>
                    </div>
                </div>

                <div class="tasks-list" id="tasksList">
                    <!-- Tasks will be rendered here -->
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📭</div>
                    <p>No tasks found. Create one to get started!</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button id="clearCompletedBtn" class="quick-action-btn">🗑️ Clear Completed</button>
                <button id="deleteAllBtn" class="quick-action-btn delete">💥 Delete All</button>
            </div>
        </main>
    </div>

    <!-- Modal for editing tasks -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editTaskForm" class="modal-form">
                <input type="hidden" id="editTaskId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editDescription" class="form-textarea" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="editCategory" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="editPriority" class="form-select">
                            <option value="low">🟢 Low</option>
                            <option value="medium">🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="editDueDate" class="form-input">
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
